<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212529">
    <title>THI Heatstress App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEATstress">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">
                <span style="color:#e74c3c;">HEAT</span>stress
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html" aria-current="page"><span>Dashboard</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html"><span>Inschrijven</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><span>About</span></a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 station-picker">
                    <label for="station-select" class="text-white mb-0 small">Weerstation:</label>
                    <select id="station-select" class="form-select form-select-sm"
                        onchange="loadStation(this.value)"></select>
                </div>
            </div>
        </div>
    </nav>

    <main class="content">
        <section id="page-home">
            <div id="status-box" class="status-box">
                Laden...
            </div>

            <div id="chart-container" role="button" tabindex="0" aria-label="Vergroot de grafiek">
                <div id="thi-chart"></div>
            </div>

            <div class="table-container">
                <table id="forecast-table">
                    <thead>
                        <tr>
                            <th>Tijd</th>
                            <th>Temp (°C)</th>
                            <th>RV (%)</th>
                            <th>THI Buiten</th>
                            <th>THI Binnen</th>
                            <th>Advies</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Wordt gevuld door JS -->
                    </tbody>
                </table>
            </div>

            <div class="buienradar">
                <iframe id="buienradar-iframe" src="" frameborder="0" scrolling="no" loading="lazy"></iframe>
            </div>
        </section>

        <footer class="footer">
            <p id="last-updated">Laatst bijgewerkt: ...</p>
        </footer>
    </main>

    <div id="chart-modal" class="chart-modal" aria-hidden="true">
        <div class="chart-modal-backdrop" id="chart-modal-backdrop"></div>
        <div class="chart-modal-content" role="dialog" aria-modal="true" aria-label="Vergrote grafiek">
            <button type="button" class="chart-modal-close" id="chart-modal-close" aria-label="Sluiten">✕</button>
            <div class="chart-modal-scroll">
                <div id="thi-chart-large"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
